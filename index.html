<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SkillSwap</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f5f8ff;
  --card:#fff;
  --ink:#0b1b3b;
  --mut:#5b6b8c;
  --pri:#2457f5;
  --navy:#0a1f55;
  --line:#e2e8f5;
  --ok:#12a36b;
  --warn:#d98a0b;
  --bad:#d64545;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}

@media(prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#0a1228;
    --card:#111c3a;
    --ink:#e8eeff;
    --mut:#9aabd0;
    --line:#223158
  }
}

:root[data-theme=dark]{
  --bg:#0a1228;
  --card:#111c3a;
  --ink:#e8eeff;
  --mut:#9aabd0;
  --line:#223158
}

*{box-sizing:inherit}

html{
  scroll-padding-top:env(safe-area-inset-top,0px)
}

body{
  margin:0;
  font:15px/1.55 'Plus Jakarta Sans',system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink)
}

a{
  color:inherit;
  text-decoration:none
}

button,input,select,textarea{
  font:inherit;
  color:inherit
}

:focus-visible{
  outline:3px solid #7aa2ff;
  outline-offset:2px
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:0 20px
}

nav.top{
  position:sticky;
  top:env(safe-area-inset-top,0px);
  z-index:20;
  background:var(--card);
  border-bottom:1px solid var(--line)
}

nav.top .wrap{
  display:flex;
  align-items:center;
  gap:20px;
  height:60px
}

.logo{
  font-weight:800;
  font-size:20px;
  display:flex;
  gap:8px;
  align-items:center;
  cursor:pointer
}

.logo i{
  width:28px;
  height:28px;
  border-radius:9px;
  background:linear-gradient(135deg,var(--pri),#19b6ff);
  display:grid;
  place-items:center;
  color:#fff;
  font-style:normal
}

.sp{flex:1}

.links{
  display:flex;
  gap:18px;
  color:var(--mut)
}

.links a{
  cursor:pointer
}

.btn{
  border:0;
  border-radius:12px;
  padding:10px 18px;
  font-weight:700;
  cursor:pointer;
  background:var(--pri);
  color:#fff;
  transition:.2s
}

.btn:hover{
  transform:translateY(-1px);
  box-shadow:0 8px 20px #2457f544
}

.btn.o{
  background:transparent;
  color:var(--pri);
  border:1.5px solid var(--pri)
}

.btn.s{
  padding:6px 12px;
  font-size:13px
}

.btn.g{
  background:#e7ecfb;
  color:var(--navy)
}

.btn.r{
  background:var(--bad)
}

.hero{
  background:linear-gradient(160deg,var(--navy),#1b4ad8);
  color:#fff;
  padding:70px 0
}

.hero .wrap{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:30px;
  align-items:center
}

h1{
  font-size:clamp(32px,5vw,54px);
  line-height:1.08;
  margin:0 0 14px;
  letter-spacing:-1px
}

h2{
  font-size:28px;
  margin:0 0 6px
}

h3{
  margin:0 0 8px
}

.hero p{
  color:#cfdcff;
  max-width:480px
}

.hero .btn.o{
  color:#fff;
  border-color:#fff
}

.sec{
  padding:56px 0
}

.sub{
  color:var(--mut);
  margin:0 0 24px
}

.grid{
  display:grid;
  gap:16px;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr))
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px
}

.ic{
  width:42px;
  height:42px;
  border-radius:12px;
  background:#e7efff;
  display:grid;
  place-items:center;
  font-size:20px;
  margin-bottom:10px
}

.stat b{
  font-size:30px;
  display:block;
  color:var(--pri)
}

.chip{
  display:inline-block;
  padding:3px 10px;
  border-radius:99px;
  background:#e7efff;
  color:#1c3fb0;
  font-size:12px;
  font-weight:700;
  margin:2px 4px 2px 0
}

.chip.ok{
  background:#d9f5e9;
  color:#0b7a50
}

.chip.w{
  background:#fff0d1;
  color:#9a6200
}

.chip.b{
  background:#fde0e0;
  color:#a52b2b
}

details{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px 16px;
  margin-bottom:10px
}

summary{
  font-weight:700;
  cursor:pointer
}

footer{
  background:var(--navy);
  color:#b9c8f0;
  padding:36px 0
}

footer a{
  margin-right:16px;
  cursor:pointer
}

.auth{
  max-width:440px;
  margin:40px auto;
  padding:24px 20px
}

.tabs{
  display:flex;
  background:#e7ecfb;
  border-radius:12px;
  padding:4px;
  margin-bottom:18px
}

.tabs button{
  flex:1;
  border:0;
  background:none;
  padding:9px;
  border-radius:9px;
  font-weight:700;
  cursor:pointer;
  color:#33436b
}

.tabs .on{
  background:#fff;
  color:var(--pri);
  box-shadow:0 2px 6px #0002
}

label{
  display:block;
  font-weight:700;
  font-size:13px;
  margin:12px 0 4px
}

input,select,textarea{
  width:100%;
  padding:10px 12px;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:var(--card)
}

input.bad{
  border-color:var(--bad)
}

.err{
  color:var(--bad);
  font-size:12px;
  min-height:16px
}

.row{
  display:flex;
  gap:10px;
  align-items:center
}

.row>*{
  flex:1
}

.row .n{
  flex:none
}

.shell{
  display:grid;
  grid-template-columns:230px 1fr;
  min-height:calc(100vh - 60px)
}

.side{
  background:var(--card);
  border-right:1px solid var(--line);
  padding:14px
}

.side a{
  display:block;
  padding:10px 12px;
  border-radius:10px;
  cursor:pointer;
  color:var(--mut);
  font-weight:500
}

.side a.on,
.side a:hover{
  background:#e7efff;
  color:var(--pri)
}

.main{
  padding:22px;
  min-width:0
}

.prof{
  display:flex;
  gap:12px
}

.av{
  width:46px;
  height:46px;
  border-radius:50%;
  display:grid;
  place-items:center;
  color:#fff;
  font-weight:800;
  flex:none;
  position:relative
}

.on1:after{
  content:'';
  position:absolute;
  right:0;
  bottom:0;
  width:11px;
  height:11px;
  border-radius:50%;
  background:var(--ok);
  border:2px solid var(--card)
}

.bar{
  height:8px;
  background:#e1e8fa;
  border-radius:9px;
  overflow:hidden
}

.bar i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--pri),#19b6ff)
}

.score{
  margin-left:auto;
  font-weight:800;
  color:var(--ok);
  text-align:right
}

.chat{
  display:grid;
  grid-template-columns:240px 1fr;
  height:520px;
  padding:0;
  overflow:hidden
}

.cl{
  border-right:1px solid var(--line);
  overflow:auto
}

.cl div{
  padding:12px;
  cursor:pointer;
  border-bottom:1px solid var(--line)
}

.cl .on{
  background:#e7efff
}

.cm{
  display:flex;
  flex-direction:column
}

.msgs{
  flex:1;
  overflow:auto;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:8px
}

.m{
  max-width:75%;
  padding:9px 13px;
  border-radius:14px;
  background:#e7ecfb;
  color:#0b1b3b
}

.m.me{
  align-self:flex-end;
  background:var(--pri);
  color:#fff
}

.m small{
  display:block;
  opacity:.6;
  font-size:10px
}

table{
  width:100%;
  border-collapse:collapse
}

td,th{
  text-align:left;
  padding:9px;
  border-bottom:1px solid var(--line)
}

.star{
  cursor:pointer;
  font-size:26px;
  color:#c9d3ee;
  background:none;
  border:0
}

.star.on{
  color:#f5b301
}

#bot{
  position:fixed;
  right:18px;
  bottom:calc(18px + env(safe-area-inset-bottom,0px));
  z-index:50
}

#bt{
  width:54px;
  height:54px;
  border-radius:50%;
  border:0;
  background:var(--pri);
  color:#fff;
  font-size:24px;
  cursor:pointer;
  box-shadow:0 8px 24px #2457f566
}

#bw{
  position:absolute;
  right:0;
  bottom:66px;
  width:min(320px,calc(100vw - 36px));
  height:420px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  box-shadow:0 20px 50px #0003;
  transform:scale(.9) translateY(14px);
  opacity:0;
  pointer-events:none;
  transform-origin:bottom right;
  transition:.22s
}

#bw.open{
  transform:none;
  opacity:1;
  pointer-events:auto
}

#bw header{
  background:var(--navy);
  color:#fff;
  padding:12px 14px;
  display:flex;
  justify-content:space-between;
  font-weight:700
}

#bw header button{
  background:none;
  border:0;
  color:#fff;
  cursor:pointer;
  font-size:18px
}

#bm{
  flex:1;
  overflow:auto;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:8px
}

#bq{
  padding:0 12px 8px;
  display:flex;
  flex-wrap:wrap;
  gap:6px
}

#bq button{
  border:1px solid var(--pri);
  background:none;
  color:var(--pri);
  border-radius:99px;
  padding:4px 10px;
  font-size:12px;
  cursor:pointer
}

#bf{
  display:flex;
  gap:6px;
  padding:10px;
  border-top:1px solid var(--line)
}

#toast{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translateX(-50%);
  background:var(--ink);
  color:var(--bg);
  padding:10px 16px;
  border-radius:10px;
  opacity:0;
  transition:.3s;
  z-index:60;
  pointer-events:none
}

#toast.on{
  opacity:1
}

@media(max-width:800px){
  .hero .wrap,
  .shell,
  .chat{
    grid-template-columns:1fr
  }

  .links{
    display:none
  }

  .side{
    display:flex;
    overflow-x:auto;
    gap:4px;
    border-right:0;
    border-bottom:1px solid var(--line)
  }

  .side a{
    white-space:nowrap
  }

  .chat{
    height:auto
  }

  .cl{
    display:flex;
    overflow-x:auto
  }

  .cl div{
    min-width:150px
  }

  .cm{
    height:400px
  }
}

@media(prefers-reduced-motion:reduce){
  *{
    transition:none!important;
    animation:none!important
  }
}
</style>
</head>

<body>

<nav class="top">
  <div class="wrap">
    <a class="logo" onclick="go('home')">
      <i>⇄</i>SkillSwap
    </a>

    <div class="links">
      <a onclick="go('home','how')">How it works</a>
      <a onclick="go('home','skills')">Skills</a>
      <a onclick="go('home','faq')">FAQ</a>
    </div>

    <div class="sp"></div>
    <span id="navr"></span>
  </div>
</nav>

<div id="app"></div>

<div id="bot">
  <div id="bw">
    <header>
      SkillSwap Assistant
      <button onclick="bt()" aria-label="Minimize">—</button>
    </header>

    <div id="bm"></div>
    <div id="bq"></div>

    <form id="bf">
      <input id="bi" placeholder="Type a message" aria-label="Message">
      <button class="btn s">Send</button>
    </form>
  </div>

  <button id="bt" onclick="bt()" aria-label="Open chat">💬</button>
</div>

<div id="toast"></div>

<script>

const $=s=>document.querySelector(s);

const C=[
  '#2457f5',
  '#0e9f8e',
  '#8a4fff',
  '#e0561f',
  '#d6336c',
  '#1a8cd8',
  '#5a7d1a',
  '#b8741a'
];

let P=[];
let ME=null;
let R=[];
let RV=[];
let CH={};
let requirements=[];
let applications=[];
let cur=null;
let rate=0;
let role='student';
let authToken=localStorage.getItem('skillswapToken')||'';

const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
}[char]));

async function api(url,options={}){
  const headers={...(options.headers||{})};
  if(authToken)
    headers.Authorization='Bearer '+authToken;
  if(options.body)
    headers['Content-Type']='application/json';

  const response=await fetch(url,{
    ...options,
    headers,
    body:options.body?JSON.stringify(options.body):undefined
  });
  const data=await readResponse(response);

  if(!response.ok){
    if(response.status===401){
      authToken='';
      localStorage.removeItem('skillswapToken');
      ME=null;
    }
    throw new Error(responseError(response,data,'The request could not be completed.'));
  }

  return data;
}

async function readResponse(response){
  const text=(await response.text()).trim();
  if(!text)
    return {};
  try{
    const data=JSON.parse(text);
    return data&&typeof data==='object'?data:{error:text};
  }catch{
    return {error:text};
  }
}

function responseError(response,data,fallback){
  const detail=typeof data.error==='string'?data.error.trim():'';
  if(detail&&!(response.status===403&&/^forbidden\.?$/i.test(detail)))
    return detail;
  if(response.status===403){
    return `${fallback} (403 Forbidden). Make sure this request reaches the SkillSwap backend and that public Google OAuth routes are not blocked by authentication middleware.`;
  }
  return `${fallback} (HTTP ${response.status}${response.statusText?' '+response.statusText:''}).`;
}

async function configureGoogleButton(){
  const button=$('#googleBtn');
  const message=$('#googleError');
  if(!button)
    return;
  try{
    const response=await fetch('/api/auth/google');
    const config=await readResponse(response);
    if(!response.ok)
      throw new Error(responseError(response,config,'Could not load Google sign-in configuration.'));
    if(!config.configured){
      button.disabled=true;
      if(message)
        message.textContent='Google sign-in is not configured yet. Set GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, and GOOGLE_CALLBACK_URL in the server .env file, then restart the server.';
      return;
    }
    button.disabled=false;
  }catch(error){
    button.disabled=true;
    if(message)
      message.textContent=error.message;
  }
}

function startGoogleSignIn(){
  const button=$('#googleBtn');
  button.disabled=true;
  location.assign('/auth/google?role='+encodeURIComponent(role));
}

function fromApiUser(user){
  return {
    ...user,
    n:user.name,
    s:user.teaches?.[0]||user.wants?.[0]||'SkillSwap member',
    t:user.teaches||[],
    l:user.wants||[],
    m:user.learningMode||'Online',
    a:user.availability||'Evenings',
    lv:user.level||'Beginner',
    r:user.rating||0,
    loc:user.location||'',
    d:user.bio||'',
    profilePhoto:user.profilePhoto||'',
    matchScore:user.match||0,
    matchReasons:user.reasons||[]
  };
}

async function loadPeople(query=''){
  const data=await api('/api/users'+(query?'?'+query:''));
  P=data.users.map(fromApiUser);
  return P;
}

const ini=n=>n.split(' ').map(x=>x[0]).join('');

const av=(n,i,on,photo='')=>`
<div class="av ${on?'on1':''}" style="background:${C[i%8]}">
${photo?`<img src="${esc(photo)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">`:ini(n)}
</div>
`;

function match(p){
  const teaches=ME?.teaches||ME?.t||[];
  const wants=ME?.wants||ME?.l||[];
  let a=p.t.filter(x=>wants.includes(x)).length;
  let b=p.l.filter(x=>teaches.includes(x)).length;

  let w=[];

  let s=
    30+
    Math.min(a,2)*15+
    Math.min(b,2)*10+
    (p.m==(ME?.learningMode||ME?.m)||p.m=='Both'?7:0)+
    (p.a==(ME?.availability||ME?.a)?8:0);

  if(a)
    w.push(
      'Teaches '+
      p.t.filter(x=>wants.includes(x)).join(', ')+
      ' you want'
    );

  if(b)
    w.push(
      'Wants '+
      p.l.filter(x=>teaches.includes(x)).join(', ')+
      ' you offer'
    );

  if(p.m==(ME?.learningMode||ME?.m)||p.m=='Both')
    w.push('Same learning mode');

  if(p.a==(ME?.availability||ME?.a))
    w.push('Both free '+p.a.toLowerCase());

  return {
    s:Math.min(s,98),
    w
  };
}

const toast=m=>{
  const t=$('#toast');
  t.textContent=m;
  t.classList.add('on');

  setTimeout(()=>{
    t.classList.remove('on');
  },2200);
};

function go(v,sec){

  location.hash=v;

  render(v);

  if(sec)
    setTimeout(()=>{
      document
        .getElementById(sec)
        ?.scrollIntoView({behavior:'smooth'});
    },50);
  else
    scrollTo(0,0);
}

const shell=(v,body,items)=>`
<div class="shell">

<aside class="side">

${items.map(([k,l])=>`
<a
 class="${v==k?'on':''}"
 onclick="go('${k}')"
>${l}</a>
`).join('')}

<a onclick="logout()">Logout</a>

</aside>

<main class="main">
${body}
</main>

</div>
`;

function logout(){
  if(authToken)
    api('/api/auth/logout',{method:'POST'}).catch(console.error);
  authToken='';
  ME=null;
  P=[];
  R=[];
  RV=[];
  CH={};
  requirements=[];
  applications=[];
  localStorage.removeItem('skillswapToken');
  role='student';
  toast('Signed out');
  go('home');
}

const SN=[
 ['dash','Dashboard'],
 ['find','Find Skills'],
 ['reqs','Requests'],
 ['msg','Messages'],
 ['rev','Reviews']
];

const card=(p,i)=>{
  const m={
    s:p.matchScore||match(p).s,
    w:p.matchReasons?.length?p.matchReasons:match(p).w
  };

  return `
  <div class="card">

    <div class="prof">

      ${av(esc(p.n),i,i%2==0,p.profilePhoto)}

      <div>
        <b>        ${esc(p.n)}</b>
        <br>
        <span style="color:var(--mut)">
          ${esc(p.s)} · ${esc(p.lv)} · ${esc(p.loc)}
        </span>
      </div>

      <div class="score">
        ${m.s}%
        <br>
        <small>Match</small>
      </div>

    </div>

    <p>${esc(p.d)}</p>

    <div>
      ${p.t.map(x=>`
        <span class="chip">${esc(x)}</span>
      `).join('')}

      <span class="chip ok">${esc(p.m)}</span>

      <span class="chip w">
        ★ ${Number(p.r).toFixed(1)}
      </span>
    </div>

    <p style="font-size:13px;color:var(--mut)">
      <b>Why:</b>
      ${m.w.map(esc).join(' · ')||'Shared availability'}
    </p>

    <div class="row">

      <button
        class="btn g s"
        onclick="toast('Opening profile')"
      >
        View Profile
      </button>

      ${ME?.role==='student'?`
      <button
        class="btn s"
        onclick="conn(${Number(p.id)})"
      >
        Connect
      </button>
      `:''}

    </div>

  </div>
  `;
};

async function conn(userId){
  try{
    const person=P.find(user=>Number(user.id)===Number(userId));
    await api('/api/requests',{
      method:'POST',
      body:{receiverId:Number(userId),message:'Hi! I would like to swap skills with you.'}
    });
    toast('Request sent to '+(person?.n||'member'));
    if(location.hash==='#reqs')
      await loadPage('reqs');
  }catch(error){
    toast(error.message);
  }
}

async function changeRequest(id,status){
  try{
    await api('/api/requests/'+id,{method:'PATCH',body:{status}});
    toast(status==='Completed'?'Marked completed — you can leave a review':'Request '+status.toLowerCase());
    await loadPage('reqs');
  }catch(error){
    toast(error.message);
  }
}

async function applyToRequirement(id){
  try{
    await api('/api/requirements/'+id+'/apply',{method:'POST',body:{}});
    toast('Application submitted');
    await loadPage('reqs');
  }catch(error){
    toast(error.message);
  }
}

async function changeApplication(id,status){
  try{
    await api('/api/applications/'+id,{method:'PATCH',body:{status}});
    toast('Application '+status.toLowerCase());
    await loadPage('clientapp');
  }catch(error){
    toast(error.message);
  }
}

async function openConversation(userId,page='msg'){
  cur=String(userId);
  try{
    const data=await api('/api/messages/'+Number(userId));
    if(!CH[cur]){
      const person=P.find(user=>Number(user.id)===Number(userId));
      const application=applications.find(item=>Number(item.student_id)===Number(userId));
      CH[cur]={user:person||{
        id:Number(userId),
        n:application?.student_name||'Member',
        s:application?.skill||'SkillSwap member'
      },messages:[]};
    }
    CH[cur].messages=data.messages;
    render(page,true);
  }catch(error){
    toast(error.message);
  }
}

async function submitReview(){
  const reviewedId=Number($('#reviewUser')?.value);
  const text=$('#rt')?.value.trim()||'';
  if(!reviewedId||!rate||!text)
    return toast('Choose a member, rating and feedback');
  try{
    await api('/api/reviews',{method:'POST',body:{reviewedId,rating:rate,text}});
    rate=0;
    toast('Review submitted');
    await loadPage('rev');
  }catch(error){
    toast(error.message);
  }
}

async function loadPage(page){
  if(!ME||!authToken)
    return;
  try{
    if(page==='dash'){
      const [matches,requests,reviews]=await Promise.all([
        api('/api/matches'),api('/api/requests'),api('/api/reviews')
      ]);
      P=matches.matches.map(fromApiUser);
      R=requests.requests;
      RV=reviews.reviews;
    }else if(page==='find'){
      await loadPeople();
    }else if(page==='reqs'){
      const results=await Promise.all([
        api('/api/requests'),api('/api/requirements/all')
      ]);
      R=results[0].requests;
      requirements=results[1].requirements;
    }else if(page==='rev'){
      const results=await Promise.all([api('/api/reviews'),api('/api/requests')]);
      RV=results[0].reviews;
      R=results[1].requests;
    }else if(page==='clientdash'){
      const results=await Promise.all([
        api('/api/requirements'),api('/api/applications'),api('/api/users'),api('/api/requests')
      ]);
      requirements=results[0].requirements;
      applications=results[1].applications;
      P=results[2].users.map(fromApiUser);
      R=results[3].requests;
    }else if(page==='clientreq'){
      const data=await api('/api/requirements');
      requirements=data.requirements;
    }else if(page==='clientapp'){
      const data=await api('/api/applications');
      applications=data.applications;
    }else if(page==='msg'||page==='clientmsg'){
      const requestData=await api('/api/requests');
      R=requestData.requests;
      if(ME.role==='client'){
        const applicationData=await api('/api/applications');
        applications=applicationData.applications;
      }
      const contacts={};
      R.forEach(request=>{
        const id=Number(request.sender_id)===Number(ME.id)?request.receiver_id:request.sender_id;
        const name=Number(request.sender_id)===Number(ME.id)?request.receiver_name:request.sender_name;
        contacts[id]={user:{id:Number(id),n:name,s:'SkillSwap member'},messages:[]};
      });
      applications.forEach(application=>{
        contacts[application.student_id]={
          user:{id:Number(application.student_id),n:application.student_name,s:application.skill,profilePhoto:application.profile_photo},
          messages:[]
        };
      });
      CH=contacts;
      if(!CH[cur])
        cur=Object.keys(CH)[0]||null;
      if(cur){
        const data=await api('/api/messages/'+Number(cur));
        CH[cur].messages=data.messages;
      }
    }else if(page==='admin'){
      const data=await api('/api/admin/stats');
      window.adminStats=data;
    }

    if(location.hash==='#'+page)
      render(page,true);
  }catch(error){
    toast(error.message);
  }
}

/* =====================================================
   FORM FIELD HELPER
   ===================================================== */

function f(l,t,i){

  return `
  <label for="${i}">
    ${l}
  </label>

  <input
    id="${i}"
    type="${t}"
  >

  <div class="err"></div>
  `;
}

/* =====================================================
   ROLE SWITCH
   THIS FIXES THE CLIENT BUTTON
   ===================================================== */

function setRole(newRole,page='login'){

  role=newRole;

  render(page);

  console.log('Selected role:',role);
}

/* =====================================================
   PASSWORD SHOW/HIDE
   ===================================================== */

function togglePassword(){

  const pw=$('#pw');

  if(!pw) return;

  pw.type=
    pw.type==='password'
    ?'text'
    :'password';
}

/* =====================================================
   RENDER
   ===================================================== */

function render(v,hydrated=false){

  if(!V[v]){
    v='home';
  }

  const protectedPages=[
    'dash','find','reqs','msg','rev','admin',
    'clientdash','clientreq','clientapp','clientmsg'
  ];
  if(protectedPages.includes(v)&&!authToken)
    v='login';
  if(v.startsWith('client')&&ME&&ME.role!=='client')
    v='dash';
  if(['dash','find','reqs','msg','rev'].includes(v)&&ME?.role==='client')
    v='clientdash';
  if(v==='admin'&&ME?.role!=='admin')
    v='dash';

  $('#navr').innerHTML=

  [
    'dash',
    'find',
    'reqs',
    'msg',
    'rev',
    'admin',
    'clientdash',
    'clientreq',
    'clientapp',
    'clientmsg'
  ].includes(v)

  ?

  `

  <span class="chip ok">

  ${
    v.startsWith('client')
    ?'Client'
    :v=='admin'
    ?'Admin'
    :'Student'
  }

  </span>

  `

  :

  `

  <button
    class="btn o s"
    onclick="go('login')"
  >
    Login
  </button>

  <button
    class="btn s"
    onclick="go('reg')"
  >
    Register
  </button>

  `;

  $('#app').innerHTML=V[v]();

  bind(v);
  if(!hydrated&&protectedPages.includes(v)&&v!=='find')
    void loadPage(v);
}

/* =====================================================
   EVENT BINDINGS
   ===================================================== */

function bind(v){

  /* =========================
     LOGIN
     ========================= */

  if(v=='login'){

    const form=$('#lf');
    void configureGoogleButton();
    $('#googleBtn').onclick=startGoogleSignIn;

    form.onsubmit=async e=>{

      e.preventDefault();

      let ok=1;

      const em=$('#em').value.trim();
      const pw=$('#pw');

      $('#e1').textContent=
        /^\S+@\S+\.\S+$/.test(em)
        ?''
        :(ok=0,'Enter a valid email address.');

      $('#e2').textContent=
        pw.value.length>=6
        ?''
        :(ok=0,'Password must be at least 6 characters.');

      if(!ok)
        return;

      const b=$('#lb');

      b.textContent='Signing in…';
      b.disabled=true;

      try{
        const data=await api('/api/auth/login',{
          method:'POST',
          body:{email:em,password:pw.value,role}
        });
        authToken=data.token;
        localStorage.setItem('skillswapToken',authToken);
        ME=fromApiUser(data.user);
        role=ME.role;
        go(role==='client'?'clientdash':role==='admin'?'admin':'dash');
      }catch(error){
        $('#e2').textContent=error.message;
        b.textContent='Login';
        b.disabled=false;
      }

    };

  }

  /* =========================
     STUDENT REGISTRATION
     ========================= */

  if(v=='reg' && role=='student'){

    let s=0;

    const st=document.querySelectorAll('.st');

    const show=()=>{

      st.forEach((x,i)=>{
        x.hidden=i!=s;
      });

      $('#pg').style.width=
        (s+1)*33.3+'%';

      $('#nx').textContent=
        s==2
        ?'Create account'
        :'Next';

      $('#pv').style.visibility=
        s
        ?'visible'
        :'hidden';
    };

    show();

    $('#pv').onclick=()=>{

      if(s>0){
        s--;
        show();
      }

    };

    $('#rf').onsubmit=async e=>{

      e.preventDefault();

      let ok=1;

      st[s]
      .querySelectorAll('input:not([type=file])')
      .forEach(i=>{

        const bad=
          !i.value.trim() ||
          (
            i.type=='email' &&
            !/^\S+@\S+\.\S+$/.test(i.value)
          ) ||
          (
            i.id=='rp' &&
            i.value.length<8
          ) ||
          (
            i.id=='rc' &&
            i.value!=$('#rp').value
          );

        i.classList.toggle('bad',bad);

        i.nextSibling.textContent=
          bad
          ?'Check this field.'
          :'';

        if(bad)
          ok=0;

      });

      if(!ok)
        return;

      if(s<2){

        s++;

        show();

      }else{
        const selects=st[2].querySelectorAll('select');
        const requirementSkills=value=>value.split(',').map(skill=>skill.trim()).filter(Boolean);
        try{
          const photoFile=st[1].querySelector('input[type=file]').files[0];
          if(photoFile&&photoFile.size>1024*1024)
            return toast('Profile photo must be under 1 MB');
          const profilePhoto=photoFile?await new Promise((resolve,reject)=>{
            const reader=new FileReader();
            reader.onload=()=>resolve(reader.result);
            reader.onerror=()=>reject(new Error('Could not read profile photo'));
            reader.readAsDataURL(photoFile);
          }):'';
          await api('/api/auth/register',{
            method:'POST',
            body:{
              name:$('#rn').value.trim(),
              email:$('#re').value.trim(),
              password:$('#rp').value,
              role:'student',
              organization:$('#ru').value.trim(),
              course:$('#rcs').value.trim(),
              year:st[1].querySelector('select').value,
              profilePhoto,
              teaches:requirementSkills($('#rt').value),
              wants:requirementSkills($('#rl').value),
              learningMode:selects[0].value,
              availability:selects[1].value,
              bio:st[2].querySelector('textarea').value.trim()
            }
          });
          toast('Account created. Please sign in.');
          role='student';
          go('login');
        }catch(error){
          toast(error.message);
        }

      }

    };

  }

  /* =========================
     CLIENT REGISTRATION
     ========================= */

  if(v=='reg' && role=='client'){

    $('#cf').onsubmit=async e=>{

      e.preventDefault();

      let ok=1;

      document
      .querySelectorAll('#cf input')
      .forEach(i=>{

        const bad=
          !i.value.trim() ||
          (
            i.type=='email' &&
            !/^\S+@\S+\.\S+$/.test(i.value)
          ) ||
          (
            i.type=='password' &&
            i.value.length<8
          );

        i.classList.toggle('bad',bad);

        i.nextSibling.textContent=
          bad
          ?'Check this field.'
          :'';

        if(bad)
          ok=0;

      });

      if(!ok)
        return;
      const fields=$('#cf');
      const selects=fields.querySelectorAll('select');
      const skill=$('#cr').value.trim();
      try{
        await api('/api/auth/register',{
          method:'POST',
          body:{
            name:$('#cn').value.trim(),
            email:$('#ce').value.trim(),
            password:$('#cp').value,
            role:'client',
            organization:$('#cn').value.trim(),
            phone:$('#cc').value.trim(),
            initialRequirement:{
              title:'Hiring for '+skill,
              skill,
              description:fields.querySelector('textarea').value.trim(),
              budget:selects[0].value,
              timeline:selects[1].value
            }
          }
        });
        toast('Account created. Please sign in.');
        role='client';
        go('login');
      }catch(error){
        toast(error.message);
      }

    };

  }

  /* =========================
     FIND SKILLS
     ========================= */

  if(v=='find'){

    let searchTimer;
    const draw=async()=>{
    const params=new URLSearchParams({
      q:$('#q').value.trim(),
      mode:$('#fm').value,
      level:$('#fl').value,
      availability:$('#fa').value,
      rating:$('#fr').value
    });
    try{
      $('#res').innerHTML='<div class="card">Searching…</div>';
      await loadPeople(params.toString());
      $('#res').innerHTML=P.map((person,index)=>card(person,index)).join('')||
        '<div class="card">No matches. Try removing a filter.</div>';
    }catch(error){
      $('#res').innerHTML='<div class="card">'+esc(error.message)+'</div>';
    }
    };

    document
    .querySelectorAll('#q,#fm,#fl,#fa,#fr')
    .forEach(e=>{
    e.oninput=()=>{
      clearTimeout(searchTimer);
      searchTimer=setTimeout(draw,180);
    };
    e.onchange=draw;
    });

    draw();

  }

  /* =========================
     MESSAGES
     ========================= */

  if(v=='msg'){

    const ms=$('#ms');

    ms.scrollTop=1e5;

    $('#mf').onsubmit=async e=>{

      e.preventDefault();

      const t=$('#mi').value.trim();

      if(!t)
        return;

      if(!cur)
        return toast('Send a connection request before messaging.');
      try{
        await api('/api/messages',{
          method:'POST',
          body:{receiverId:Number(cur),body:t}
        });
        await openConversation(Number(cur),'msg');
      }catch(error){
        toast(error.message);
      }

    };

  }

  if(v==='clientdash'){
    $('#postRequirement').onclick=async()=>{
      const title=$('#clientReq').value.trim();
      const skill=$('#clientSkill').value.trim();
      if(!title||!skill)
        return toast('Enter a requirement title and skill');
      try{
        await api('/api/requirements',{
          method:'POST',
          body:{title,skill,description:$('#clientDescription').value.trim()}
        });
        toast('Requirement posted');
        await loadPage('clientdash');
      }catch(error){
        toast(error.message);
      }
    };
  }

  if(v==='clientmsg'){
    const messages=$('#cms');
    if(messages)
      messages.scrollTop=messages.scrollHeight;
    $('#cmf').onsubmit=async e=>{
      e.preventDefault();
      const body=$('#cmi').value.trim();
      if(!body||!cur)
        return;
      try{
        await api('/api/messages',{method:'POST',body:{receiverId:Number(cur),body}});
        await openConversation(Number(cur),'clientmsg');
      }catch(error){
        toast(error.message);
      }
    };
  }

}

/* =====================================================
   CHATBOT
   ===================================================== */

const ans={
  'Find a skill':
    'Open Find Skills, search or filter, then press Connect.',

  'Find a study/skill partner':
    'Check My Matches: anyone above 80% teaches what you want and wants what you teach.',

  'How SkillSwap works':
    'Create a profile, list skills, get matched, then connect and swap.',

  'How to create a profile':
    'Choose Register, pick Student or Client, and finish the 3 steps.',

  'How to send a request':
    'Press Connect on any profile. Track it under Requests.',

  'Contact support':
    'Email support@skillswap.com — we reply within a day.'
};

function say(t,me){

  $('#bm').insertAdjacentHTML(
    'beforeend',
    `<div class="m ${me?'me':''}">${t}</div>`
  );

  $('#bm').scrollTop=1e5;
}

function ask(q){

  say(q,1);

  setTimeout(()=>{

    say(
      ans[q] ||
      'I can help with finding skills, profiles and requests. Try a quick option below.'
    );

  },400);
}

function bt(){

  const w=$('#bw');

  w.classList.toggle('open');

  if(!$('#bm').children.length){

    say(
      'Hi! 👋 How can I help you today?'
    );

    $('#bq').innerHTML=
      Object.keys(ans)
      .map(k=>`<button>${k}</button>`)
      .join('');

    $('#bq').onclick=e=>{

      if(e.target.tagName=='BUTTON')
        ask(e.target.textContent);

    };

  }

}

$('#bf').onsubmit=e=>{

  e.preventDefault();

  const t=$('#bi').value.trim();

  if(t){

    ask(
      Object.keys(ans)
      .find(k=>
        t.toLowerCase()
        .includes(
          k.split(' ').pop().toLowerCase()
        )
      ) || t
    );

    $('#bi').value='';

  }

};

/* =====================================================
   HASH ROUTING
   ===================================================== */

onhashchange=()=>{

  const h=location.hash.slice(1).split('?')[0];

  if(V[h])
    render(h);

};

render(V[location.hash.slice(1)]?location.hash.slice(1):'home');

async function startApp(){
  const hashParts=location.hash.slice(1).split('?');
  const params=new URLSearchParams(hashParts[1]||'');
  const ticket=params.get('google_ticket');
  const googleError=params.get('google_error');
  if(ticket){
    history.replaceState(null,'',location.pathname+location.search+'#login');
    try{
      const data=await api('/api/auth/google/exchange',{
        method:'POST',
        body:{ticket}
      });
      authToken=data.token;
      localStorage.setItem('skillswapToken',authToken);
      ME=fromApiUser(data.user);
      role=ME.role;
      go(role==='client'?'clientdash':'dash');
    }catch(error){
      render('login');
      toast(error.message);
    }
    return;
  }
  if(googleError){
    history.replaceState(null,'',location.pathname+location.search+'#login');
    const messages={
      cancelled:'Google sign-in was cancelled.',
      state:'Google sign-in expired or could not be verified. Please try again.',
      account:'This Google account could not be linked to your SkillSwap account.',
      config:'Google sign-in is not configured. Check the server OAuth environment variables.',
      failed:'Google sign-in failed. Please try again.'
    };
    toast(messages[googleError]||messages.failed);
  }
  if(!authToken)
    return;
  try{
    const data=await api('/api/auth/me');
    ME=fromApiUser(data.user);
    role=ME.role;
    const requested=location.hash.slice(1);
    const defaultPage=role==='client'?'clientdash':'dash';
    const page=V[requested]&&requested!=='home'?requested:defaultPage;
    if(!location.hash||location.hash==='#home')
      location.hash=page;
    render(page);
  }catch(error){
    toast('Your saved session has expired. Please sign in again.');
    render('login');
  }
}

void startApp();

</script>
